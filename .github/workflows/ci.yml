name: ci

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled too, so that adding or removing perf-ok re-runs the
    # speed check below.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The prompt has to work on the distros it is used on, so the checks run in
  # their containers rather than on the runner's Ubuntu.
  prompt:
    name: prompt (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora 45, container: "fedora:45" }
          - { name: rhel 9,    container: "almalinux:9" }
          - { name: rhel 10,   container: "almalinux:10" }
    steps:
      - name: Container prerequisites
        run: dnf install -y git jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parses
        run: bash -n ps1.bash

      # Anything printed at source time lands in every new shell.
      - name: Sources without output
        run: |
          out=$(bash --norc --noprofile -c 'source ./ps1.bash' 2>&1)
          [ -z "$out" ] || { echo "noisy when sourced:"; echo "$out"; exit 1; }

      # A real repo with each dirty state, rendered the way bash renders it:
      # __prompt_render fills __PS1_GIT and prints the right side. No gh here,
      # so the GitHub segments must drop out rather than error.
      - name: Renders a dirty repo, and nothing outside one
        run: |
          set -euo pipefail
          source .github/ci/lib.bash
          t=$(mktemp -d); cd "$t"
          git init -q -b main r && cd r
          echo a > a; echo b > b; git add a b; git commit -qm init
          echo staged > a; git add a; echo unstaged > b; echo new > c
          out=$(render); echo "$out"
          for w in 'LEFT= main' '1 staged' '1 unstaged' '1 untracked'; do want "$w"; done
          if grep -qiE 'command not found|error|syntax' <<<"$out"; then exit 1; fi
          cd /
          out=$(render | tr -d '\n')
          [ "$out" = "LEFT=" ] || { echo "outside a repo, the prompt still drew: $out"; exit 1; }
          echo "ok"

      # The PS1_* variables are the public interface: an override must take
      # effect, a bad value must warn and keep the default, and nothing the
      # settings block uses may leak into the user's shell.
      - name: Color and icon settings
        run: |
          set -euo pipefail
          got=$(PS1_COLOR_BRANCH='#ff8800' PS1_COLOR_HOST=08 PS1_ICON_AHEAD='^' PS1_ICON_PUBLIC='' \
            bash --norc --noprofile -c 'source ./ps1.bash
              printf "%q|%q|%s%s|[%s]%s|" "$__C_BRANCH" "$__C_HOST" "$__I_AHEAD" "$__IW_AHEAD" "$__I_PUBLIC" "$__IW_PUBLIC"
              printf "%s" "${PS1@P}" | grep -q $'"'"'\e\[38;5;8m'"'"' && printf host-in-ps1
              declare -F __ps1_color >/dev/null && printf LEAK; [ -z "${LC_ALL+x}" ] || printf LCLEAK; true')
          want="\$'\\E[38;2;255;136;0m'|\$'\\E[38;5;8m'|^1|[]0|host-in-ps1"
          [ "$got" = "$want" ] || { echo "got:  $got"; echo "want: $want"; exit 1; }
          err=$(PS1_COLOR_PATH=bogus bash --norc --noprofile -c 'source ./ps1.bash; printf "%q" "$__C_PATH"' 2>&1 >/dev/null)
          grep -q 'PS1_COLOR_PATH' <<<"$err" || { echo "no warning for a bad color: $err"; exit 1; }
          echo "ok"

      # A hook after this one must still see the last command's exit status.
      - name: Leaves $? alone
        run: |
          cd "$(mktemp -d)"   # outside any repo, so only the hook prints
          # 7, not `false`: outside a repo the prompt itself returns 1, and a
          # test using 1 would pass whether or not the status survived.
          got=$(bash --norc --noprofile -c 'PROMPT_COMMAND="echo \$?"; source "$GITHUB_WORKSPACE/ps1.bash"; (exit 7); eval "$PROMPT_COMMAND"')
          [ "$got" = 7 ] || { echo "the next hook saw \$?=$got after exit 7"; exit 1; }
          echo "ok"

      # Conflicted paths and the operation that left them.
      - name: Renders a merge and a rebase in progress
        run: |
          set -euo pipefail
          source .github/ci/lib.bash
          t=$(mktemp -d); cd "$t"
          git init -q -b main r && cd r
          echo base > f; git add f; git commit -qm base
          git checkout -qb topic; echo topic > f; git commit -qam topic
          git checkout -q main;   echo main  > f; git commit -qam main
          git merge topic >/dev/null 2>&1 || true
          out=$(render); echo "$out"
          want '1 unmerged'; want 'LEFT= main|MERGING'
          git merge --abort
          git checkout -q topic
          git rebase main >/dev/null 2>&1 || true
          out=$(render); echo "$out"
          want '1 unmerged'; want 'LEFT= topic|REBASE 1/1'
          git rebase --abort
          # Picking two commits, the first conflicts, and its resolution is
          # committed by hand: git drops CHERRY_PICK_HEAD, the sequence goes on.
          git checkout -q main
          git checkout -qb side; echo x > g; git add g; git commit -qm side2
          git checkout -q main
          git cherry-pick topic side >/dev/null 2>&1 || true
          echo resolved > f; git add f; git commit -q --no-edit
          [ ! -e .git/CHERRY_PICK_HEAD ] || { echo "test setup: CHERRY_PICK_HEAD still there"; exit 1; }
          out=$(render); echo "$out"
          want 'LEFT= main|CHERRY-PICKING'
          echo "ok"

      # The GitHub segments against a stand-in gh that logs every call, so
      # what is asked, of which repo, and how often, can all be checked.
      - name: GitHub segments, against a stub gh
        run: |
          set -euo pipefail
          source .github/ci/lib.bash
          t=$(mktemp -d); mkdir "$t/bin"
          cat > "$t/bin/gh" <<'EOF'
          #!/bin/bash
          echo "$*" >> "$GHLOG"
          case "$*" in
            auth*) exit 1 ;;
            *"/commits/$NO_RUNS_SHA/"*) echo '{"total_count":0,"check_runs":[]}' ;;
            *"/commits/"*) echo '{"check_runs":[
                {"status":"completed","conclusion":"success","completed_at":"2026-01-01T00:00:00Z"},
                {"status":"completed","conclusion":"timed_out","completed_at":"2026-01-01T00:05:00Z"}]}' ;;
            *"repos/me/app -q .visibility") echo public ;;
            *"/rules/branches/"*) echo 1 ;;
            *"repos/me/app/branches/main -q .protected") echo true ;;
            *"/branches/limited -q .protected") echo '{"message":"API rate limit exceeded","status":"403"}'; exit 1 ;;
            *"/branches/"*) echo '{"message":"Branch not found","status":"404"}'; exit 1 ;;
          esac
          EOF
          chmod +x "$t/bin/gh"
          export PATH="$t/bin:$PATH" XDG_RUNTIME_DIR="$t/run" GHLOG="$t/gh.log" NO_RUNS_SHA=none-yet
          cd "$t" && git init -q -b main r && cd r
          git commit -q --allow-empty -m one
          # A fork: `upstream` is the parent, which bare `gh repo view` picks.
          git remote add origin git@github.com:me/app.git
          git remote add upstream https://github.com/parent/app.git
          git config branch.main.remote origin; git config branch.main.merge refs/heads/main
          git update-ref refs/remotes/origin/main HEAD
          git branch -q 'fix#1'; git branch -q limited

          # Renders twice: the first prompt starts the refreshes, the second
          # reads what they wrote once no .pending marker is left.
          prompt() {
            for _ in 1 2; do
              out=$(render)
              for _ in $(seq 50); do
                [ -n "$(find "$XDG_RUNTIME_DIR" -name '*.pending' 2>/dev/null)" ] || break; sleep 0.1
              done
            done
            echo "$out"
          }

          out=$(prompt); echo "$out"
          want '[1/2 ❌'           # timed_out is a failure, not a pass
          want 'LEFT= 🌍 main 🛡️'
          if grep -q parent "$GHLOG"; then echo "asked about the fork's parent"; cat "$GHLOG"; exit 1; fi

          git checkout -q 'fix#1'
          out=$(prompt)
          grep -qF 'rules/branches/fix%231' "$GHLOG" || { echo "branch not URL-encoded"; cat "$GHLOG"; exit 1; }

          # Only a 404 means "not pushed yet". A rate limit is no answer, and
          # must not be answered by the rulesets endpoint, which cannot see
          # classic protection.
          git checkout -q limited
          out=$(prompt)
          grep -qF 'branches/limited -q .protected' "$GHLOG" || { echo "never asked about the branch"; cat "$GHLOG"; exit 1; }
          if grep -qF 'rules/branches/limited' "$GHLOG"; then echo "fell back on a rate limit"; cat "$GHLOG"; exit 1; fi
          git checkout -q main

          # Visibility is the repo's, not the branch's: three branches, one call.
          n=$(grep -c ' -q .visibility' "$GHLOG")
          [ "$n" = 1 ] || { echo "visibility fetched $n times for one repo"; cat "$GHLOG"; exit 1; }

          # No check runs is an answer too: it must be cached, not refetched
          # on every prompt. A fresh runtime dir starts with nothing cached.
          NO_RUNS_SHA=$(git rev-parse HEAD); export NO_RUNS_SHA
          export XDG_RUNTIME_DIR="$t/run2"; : > "$GHLOG"
          out=$(prompt); out=$(prompt)
          n=$(grep -c "commits/$NO_RUNS_SHA/" "$GHLOG")
          [ "$n" = 1 ] || { echo "a commit with no runs was fetched $n times"; exit 1; }
          echo "ok"

      # gh is looked for on the first prompt, and again only when PATH
      # changes: one that arrives with a PATH change mid-session is used.
      - name: Notices gh when PATH gains it
        run: |
          set -euo pipefail
          t=$(mktemp -d); mkdir "$t/bin"
          printf '#!/bin/bash\necho "$*" >> "$GHLOG"\n' > "$t/bin/gh"; chmod +x "$t/bin/gh"
          export XDG_RUNTIME_DIR="$t/run" GHLOG="$t/gh.log"; : > "$GHLOG"
          cd "$t" && git init -q -b main r && cd r
          git commit -q --allow-empty -m one; git remote add origin git@github.com:me/app.git
          bash --norc --noprofile -c "source '$GITHUB_WORKSPACE/ps1.bash'
            __prompt_render >/dev/null                  # no gh on PATH yet
            [ -s '$GHLOG' ] && { echo 'gh ran before it was on PATH'; exit 1; }
            PATH='$t/bin':\$PATH
            __prompt_render >/dev/null; sleep 2" || exit 1
          [ -s "$GHLOG" ] || { echo "gh was never used after PATH gained it"; exit 1; }
          echo "ok"

      # Within one shell the GitHub segments remember what they read. Moving
      # between repos and branches must never show one's markers on another,
      # and an answer that was still being fetched must appear on the next
      # Enter rather than be remembered as "nothing yet".
      - name: Remembers per repo and branch, within one shell
        run: |
          set -euo pipefail
          t=$(mktemp -d); mkdir "$t/bin"
          cat > "$t/bin/gh" <<'EOF'
          #!/bin/bash
          case "$*" in
            *"repos/me/app -q .visibility") echo public ;;
            *"repos/me/lib -q .visibility") echo private ;;
            *"repos/me/app/branches/main -q .protected") echo true ;;
            *"/branches/"*) echo false ;;
            *"/commits/"*) echo '{"check_runs":[{"status":"completed","conclusion":"success","completed_at":"2026-01-01T00:00:00Z"}]}' ;;
          esac
          EOF
          chmod +x "$t/bin/gh"
          export PATH="$t/bin:$PATH" XDG_RUNTIME_DIR="$t/run"
          for r in app lib; do
            git init -q -b main "$t/$r"; git -C "$t/$r" commit -q --allow-empty -m one
            git -C "$t/$r" remote add origin "git@github.com:me/$r.git"
          done
          git -C "$t/app" branch -q topic
          out=$(bash --norc --noprofile -c "
            source '$GITHUB_WORKSPACE/ps1.bash'; COLUMNS=200
            show()   { __prompt_render >/dev/null; printf '%s=%s\n' \"\$1\" \"\$__PS1_GIT\"; }
            settle() { for _ in \$(seq 50); do [ -n \"\$(find '$t/run' -name '*.pending' 2>/dev/null)\" ] || break; sleep 0.1; done; }
            cd '$t/app'; show app-first; settle; show app-second
            cd '$t/lib'; __prompt_render >/dev/null; settle
            cd '$t/app'; git checkout -q topic; __prompt_render >/dev/null; settle; git checkout -q main
            cd '$t/app'; show app-main
            cd '$t/lib'; show lib-main
            cd '$t/app'; git checkout -q topic; show app-topic
            git checkout -q main; show app-main-again
            printf 'right=%s\n' \"\$(__prompt_render)\"
          " | sed 's/\x1b\[[0-9;]*[mG]//g; s/[\x01\x02\r]//g')
          echo "$out"
          for want in 'app-first= main' 'app-second= 🌍 main 🛡️' 'app-main= 🌍 main 🛡️' 'lib-main= 🔒 main' \
                      'app-topic= 🌍 topic' 'app-main-again= 🌍 main 🛡️'; do
            grep -qxF "$want" <<<"$out" || { echo "missing: $want"; exit 1; }
          done
          grep -qF '[1/1 ✅' <<<"$out" || { echo "CI block missing"; exit 1; }
          echo "ok"

      # A cache key carries the repo's path, and a path deeper than a file
      # name can be must still cache: one refresh, not one per Enter.
      - name: Deep paths still cache
        run: |
          set -euo pipefail
          source .github/ci/lib.bash
          t=$(mktemp -d); mkdir "$t/bin"
          printf '#!/bin/bash\necho "$*" >> "$GHLOG"\ncase "$*" in *visibility) echo public ;; esac\n' > "$t/bin/gh"
          chmod +x "$t/bin/gh"
          export PATH="$t/bin:$PATH" XDG_RUNTIME_DIR="$t/run" GHLOG="$t/gh.log"
          d="$t/$(printf 'd%.0s' {1..90})/$(printf 'e%.0s' {1..90})/$(printf 'f%.0s' {1..90})"
          mkdir -p "$d"; cd "$d"; git init -q -b main .
          git commit -q --allow-empty -m one
          git remote add origin git@github.com:me/app.git
          for _ in 1 2 3 4; do
            out=$(COLUMNS=1000 render)   # wide enough for a path this long
            for _ in $(seq 50); do
              [ -n "$(find "$XDG_RUNTIME_DIR" -name '*.pending' 2>/dev/null)" ] || break; sleep 0.1
            done
          done
          echo "$out"
          n=$(grep -c 'visibility' "$GHLOG")
          [ "$n" = 1 ] || { echo "a ${#d}-byte path refreshed $n times in 4 prompts"; exit 1; }
          want 'LEFT= 🌍 main'
          echo "ok"

      # Sweeps the width across every value where something has to give,
      # and checks behaviour rather than arithmetic: line one never overlaps
      # itself, the globe never outlives `N conflicting`, and somewhere the
      # warning is kept with the globe gone. Producers are stubbed with
      # ASCII markers; the fitting is real. Three times: the stock PS1, a PS1
      # overridden after sourcing, and a path whose characters are two
      # columns wide — each measured here independently of ps1.bash.
      - name: Fitting drops segments in order, and never overlaps
        env:
          LC_ALL: C.UTF-8   # so that ${#s} counts characters, not bytes
        run: |
          set -euo pipefail
          source .github/ci/lib.bash
          t=$(mktemp -d); cd "$t"
          git init -q --bare up.git; git clone -q up.git a 2>/dev/null; git clone -q up.git b 2>/dev/null
          git -C a commit -q --allow-empty -m a; git -C a push -q origin HEAD:main
          git -C b fetch -q; git -C b checkout -q -B main origin/main
          git -C a commit -q --allow-empty -m a2; git -C a push -q origin HEAD:main
          git -C b commit -q --allow-empty -m b; git -C b fetch -q
          cp -a b 日本語          # the same diverged repo, under a wide name
          export PS1_ICON_AHEAD='^' PS1_ICON_BEHIND='v'
          stubs="__repo_meta_segment() { __repo_pre='G '; __repo_pre_w=2; __repo_post=''; __repo_post_w=0; }
                 __merge_segment() { __merge_out='1 conflicting  '; __merge_w=15; }
                 __gh_segment() { __gh_out='[ci]'; __gh_w=4; }"

          # sweep <columns the left text occupies> [extra setup]
          sweep() {
            local lc="$1" setup="$stubs; ${2:-}" seen=0 c out right left
            for c in $(seq $(( lc + 6 )) $(( lc + 60 ))); do
              out=$(COLUMNS=$c render "$setup")
              right=${out%%$'\n'*} left=${out##*LEFT=}
              if [ -n "$right" ] && (( lc + ${#left} + ${#right} >= c )); then
                echo "cols=$c: the right side overlaps the left: $out"; exit 1
              fi
              if [[ "$left" == ' G '* && "$right" != *conflicting* ]]; then
                echo "cols=$c: the globe outlived the conflict warning: $out"; exit 1
              fi
              if [[ "$right" == *conflicting* && "$left" != ' G '* ]]; then seen=1; fi
            done
            (( seen )) || { echo "no width kept the warning with the globe gone"; exit 1; }
          }

          cd "$t/b"
          l='\u@\h \w'; l=${l@P}; sweep ${#l}
          l='[\t] \u@\h \w'; l=${l@P}; sweep ${#l} "PS1='[\t] '\"\$PS1\""
          cd "$t/日本語"
          l='\u@\h \w'; l=${l@P}; sweep $(( ${#l} + 3 ))   # 日本語: three characters, six columns
          echo "ok"

      # The README's measuring tool runs, inside a repo and outside one.
      - name: time-prompt.sh runs
        run: |
          set -euo pipefail
          t=$(mktemp -d); cd "$t"
          out=$("$GITHUB_WORKSPACE/time-prompt.sh" 3); echo "$out"
          grep -q 'not inside a git repo' <<<"$out"
          git init -q r; cd r
          out=$("$GITHUB_WORKSPACE/time-prompt.sh" 3); echo "$out"
          grep -qE '^git status: +[0-9]+ µs' <<<"$out"
          # --compare: every row present and a number, here where git-prompt.sh exists.
          out=$("$GITHUB_WORKSPACE/time-prompt.sh" --compare 3); echo "$out"
          for row in 'stock prompt alone' '+ ps1.bash' "+ git's __git_ps1, branch only" '+ __git_ps1 with dirty'; do
            grep -qF -- "$row" <<<"$out" || { echo "missing row: $row"; exit 1; }
          done
          if grep -qE ' 0 µs$' <<<"$out"; then echo "a comparison measured nothing"; exit 1; fi

      # The caches must never be a fixed name in a shared /tmp (see ps1.bash).
      - name: No cache in a shared /tmp
        run: |
          if grep -nE '"/tmp/|=/tmp/' ps1.bash; then
            echo "a cache path points into /tmp"; exit 1
          fi

  # Speed has two checks, because a timing alone cannot be trusted on a
  # shared runner. The process count is exact: it either is one or it is
  # not. The timing compares this PR with its base branch on the same
  # machine in the same job, with git's own variance taken out, and fails
  # on a real slowdown; the perf-ok label says one is intended.
  perf:
    runs-on: ubuntu-latest
    container: fedora:45
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - name: Container prerequisites
        run: dnf install -y git jq strace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # the base branch too, to compare against

      # Processes, not threads: git's own worker threads are clone() calls
      # too, and are not what "one process per prompt" is about.
      - name: One process per prompt in a repo, none outside
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/ps1.bash"
          procs() {  # processes started by three prompts, in the current directory
            strace -f -qq -e trace=clone,clone3,fork,vfork -o "$t/strace.log" \
              bash --norc --noprofile -c "source '$src'; for _ in 1 2 3; do __prompt_render >/dev/null; done"
            grep -E 'clone3?\(|v?fork\(' "$t/strace.log" | grep -vc CLONE_THREAD || true
          }
          t=$(mktemp -d)
          cd "$t"; n=$(procs)
          [ "$n" = 0 ] || { echo "outside a repo, 3 prompts started $n processes, want 0"; cat "$t/strace.log"; exit 1; }
          git init -q -b main r; cd r; echo a > a; git add a; git commit -qm one; echo b > a; echo c > c
          n=$(procs)
          [ "$n" = 3 ] || { echo "in a repo, 3 prompts started $n processes, want 3"; cat "$t/strace.log"; exit 1; }
          echo "ok: 0 outside a repo, 1 per prompt inside one"

      - name: No slower than the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PERF_OK: ${{ contains(github.event.pull_request.labels.*.name, 'perf-ok') }}
        run: |
          set -uo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git show "origin/$BASE_REF:ps1.bash" > /tmp/base.bash
          .github/ci/perf.bash /tmp/base.bash ps1.bash; rc=$?
          if [ "$rc" != 0 ] && [ "$PERF_OK" = true ]; then
            echo "perf-ok is set on this pull request: reported, not enforced."; rc=0
          fi
          exit "$rc"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --severity=warning ps1.bash time-prompt.sh .github/ci/lib.bash .github/ci/perf.bash
      # ps1.bash is installed verbatim into every $HOME, and this repo is public:
      # a /home/<name> path, even in a comment, breaks elsewhere and names someone.
      # Same rule as dotfiles' tools/check-content.sh, which pins this repo.
      - name: No absolute home paths
        run: |
          if git grep -nIE '(/home/|/Users/)[A-Za-z][A-Za-z0-9._-]*' -- . | grep -v '/home/linuxbrew'; then
            echo "Use \$HOME or ~ instead of an absolute home path."; exit 1
          fi

  # The one check the main ruleset requires, so adding or renaming a job above
  # never means editing the ruleset. `if: always()` so a failed or skipped
  # dependency fails this instead of leaving it pending forever.
  ci-ok:
    name: ci ok
    if: always()
    needs: [prompt, perf, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
